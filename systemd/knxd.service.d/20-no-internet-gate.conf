# Drop-in for knxd.service. Applies on top of the unit written by knxd/install.sh.
#
# Removes:
#   ExecStartPre=/bin/sh -c 'until ping -c1 google.com; do sleep 1; done;'
#
# knxd talks to a USB interface and listens on localhost. It needs no internet
# for anything. With that gate in place an internet outage - with a perfectly
# healthy LAN - meant the hall never got lighting control back, because the
# loop has no timeout.
#
# The gate was most likely a crude wait for the USB device to settle after
# boot. That is now handled properly by 10-restart.conf: if knxd starts too
# early and fails, systemd retries every 5s until it succeeds. Apply that
# drop-in first; this one depends on it.
#
# An empty ExecStartPre= clears the inherited list before it would run.

[Service]
ExecStartPre=
