# Drop-in for knxd.service. Applied to the production Pi on 2026-09-20.
#
# knxd shipped with Restart=no. On 2026-09-16 the USB link dropped during a
# power interruption, knxd exited 1, and nothing brought it back - the hall had
# no lighting control until the machine was rebooted. That is the fault behind
# "it stops responding, only a reboot helps".
#
# StartLimitIntervalSec=0 is required: with the default burst limit systemd
# gives up after 5 restarts and leaves the service dead, which is the exact
# outcome this is meant to prevent.

[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5s
